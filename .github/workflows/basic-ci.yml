name: basic-ci

# RFWhisper CI: format, lint, unit tests, and (nightly / on-demand) audio quality
# acceptance gates. Everything here maps to an acceptance criterion in ROADMAP.md
# (A*, B*, C*, ...). If a gate starts failing, do not disable it — fix the code or
# fix the gate in a separate, justified PR.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Nightly run for longer audio-quality tests on master.
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RFWHISPER_CI: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Fast lane: formatting and linting. Must stay green always.
  # ---------------------------------------------------------------------------
  lint:
    name: Format / Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install ALSA headers (cpal build dep on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt (check only)
        run: cargo fmt --check

      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Unit tests across a cross-platform matrix. Criterion A7 (v0.1).
  # ---------------------------------------------------------------------------
  unit:
    name: Unit (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-13, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Unit + integration tests
        run: cargo test --all-targets

  # ---------------------------------------------------------------------------
  # Audio quality acceptance gates. These map 1:1 to ROADMAP.md criteria.
  #
  # Non-regression gates (these MUST stay green once implemented):
  #   * cw_transient   — RMS of CW keying onset within ±1 dB of raw     (A3, C1)
  #   * ft8_regression — WSJT-X decode count denoised ≥ raw, zero false (A2, C2)
  #
  # Quality & budget gates:
  #   * snr_gain       — effective SNR gain ≥ +3 dB avg on ham mix      (A1)
  #   * noop_quality   — PESQ drop ≤ 0.3, STOI drop ≤ 0.02 on clean     (A6)
  #   * latency_probe  — end-to-end p99 < 100 ms on ref runner          (A4)
  #   * rtf            — RTF < 0.5 on reference CPU                     (A5)
  #
  # Gates run as `cargo test --release -- --ignored gate_` once the A1–A6
  # harness lands (they need fetched model weights + seed samples).
  # ---------------------------------------------------------------------------
  audio-quality:
    name: Audio quality gates (${{ matrix.os }})
    needs: unit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-13]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Fetch seed models (deterministic, SHA-pinned)
        run: |
          cargo run --release -- models fetch || echo "Model fetch unavailable (pre-v0.1)."
        env:
          RFWHISPER_ALLOW_MISSING_MODEL: "1"

      - name: Run acceptance gates
        run: cargo test --release -- --ignored gate_ || echo "No gates implemented yet (pre-v0.1)."

      - name: Upload before/after artifacts + reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-quality-${{ matrix.os }}
          path: |
            build/audio-reports/**
            build/spectrograms/**
            build/latency/**
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Packaging smoke: confirm a release binary still builds.
  # ---------------------------------------------------------------------------
  package:
    name: Package smoke
    needs: lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA headers (cpal build dep on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Release build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: rfwhisper-linux-x86_64
          path: target/release/rfwhisper
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Gatekeeper: prevents merge if anything above failed on PRs.
  # ---------------------------------------------------------------------------
  required:
    name: Required checks
    needs: [lint, unit, package]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.unit.result }}" != "success" ] || \
             [ "${{ needs.package.result }}" != "success" ]; then
            echo "One or more required jobs failed. Blocking merge."
            exit 1
          fi
          echo "All required jobs green. 73."
