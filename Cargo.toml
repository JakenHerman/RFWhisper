[package]
name = "rfwhisper"
version = "0.1.0-beta.1"
edition = "2021"
description = "Real-time AI denoising for ham radio (local-first, GPLv3+)"
license = "GPL-3.0-or-later"
repository = "https://github.com/jakenherman/rfwhisper"
homepage = "https://rfwhisper.org"
rust-version = "1.75"

[features]
# The real DeepFilterNet3 backend (#10). On by default since the beta: the
# default build is the full user-facing build (#91), and a plain
# `cargo build --release` must give hams a real denoiser, not the stub.
# It pulls the pure-Rust tract inference tree plus the bundled model, roughly
# tripling build time and binary size, so CI's fast lanes and embedders use
# `--no-default-features` (NullModel / stub only).
# `select_engine("deepfilternet3")` falls back to the stub when off.
default = ["dfn"]
dfn = ["dep:deep_filter", "dep:ndarray"]

[dependencies]
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
ctrlc = { version = "3", features = ["termination"] }
hound = "3.5"
realfft = "3"
rtrb = "0.3"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = "2"

# DeepFilterNet3 backend (feature `dfn`). Pinned to upstream's own Rust crate at
# a release tag — crates.io only publishes the old 0.2.5 (no inference runtime),
# so the tract runtime + bundled DeepFilterNet3 model come from the git tag.
# `default-features = false` drops the vorbis/flac audio decoders we don't need
# (we read WAV via hound). ndarray matches deep_filter's `^0.15` so the
# `ArrayView2<f32>` handed to `DfTract::process` is the same type.
[dependencies.deep_filter]
git = "https://github.com/Rikorose/DeepFilterNet"
tag = "v0.5.6"
default-features = false
features = ["tract", "default-model"]
optional = true

[dependencies.ndarray]
version = "0.15"
optional = true

[profile.release]
lto = true

[[bin]]
name = "rfwhisper"
path = "src/main.rs"
