[package]
name = "rfwhisper"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Real-time AI denoising for ham radio (local-first, GPLv3+)"
license = "GPL-3.0-or-later"
repository = "https://github.com/jakenherman/rfwhisper"
homepage = "https://rfwhisper.org"
rust-version = "1.75"

[dependencies]
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
hound = "3.5"
realfft = "3"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = "2"

[profile.release]
lto = true

[[bin]]
name = "rfwhisper"
path = "src/main.rs"
